[project]
name = "faa-classifier"
version = "0.1.0"
description = "ML classifier for FAA airport diagram vector objects (Taxiways / Footprints / Runways / Lights / Other)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyarrow>=15.0",
    "joblib>=1.3",
]

[project.scripts]
faa-train = "train:main"
faa-predict = "predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
